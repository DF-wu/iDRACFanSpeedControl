services:
  idrac-fan-control:
    image: ghcr.io/df-wu/idrac-fan-control:latest
    container_name: idrac-fan-control
    env_file:
      - .env
    volumes:
      - ./logs:/var/log/fan-control
      # Put an ESXi private key in ./secrets and use /run/secrets/<name> in .env.
      - ./secrets:/run/secrets:ro
    # Map each device listed in LINUX_DISK_DEVICES. Device mappings grant raw
    # hardware access, so expose only the disks used by the controller.
    # devices:
    #   - /dev/nvme1:/dev/nvme1
    network_mode: host
    restart: unless-stopped
    init: true

    # Enable this when TEMPERATURE_SOURCES includes gpu or WITH_GPU_TEMP=true.
    # Requires NVIDIA Container Toolkit on the Docker host.
    # gpus: all
